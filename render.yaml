services:
  - type: web
    name: rast-anonim
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
      - key: REPORT_SALT
        generateValue: true
